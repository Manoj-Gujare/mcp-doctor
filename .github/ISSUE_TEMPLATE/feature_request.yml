name: Feature or new check
description: Suggest a new check, output format, or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Ideally a real MCP server or tool definition where this matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should mcp-doctor report, and what fix should it suggest?
