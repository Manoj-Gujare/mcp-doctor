[project]
name = "mcpgrader"
version = "0.1.0"
description = "Lint and score any MCP server: token bloat, vague tool descriptions, and a concrete fix list."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Manoj Gujare" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "llm", "ai-agents", "lint", "audit", "tokens", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=2.0,<3",
    "typer>=0.12",
    "rich>=13.7",
    "tiktoken>=0.7",
]

[project.urls]
Homepage = "https://github.com/Manoj-Gujare/mcpgrader"
Repository = "https://github.com/Manoj-Gujare/mcpgrader"
Issues = "https://github.com/Manoj-Gujare/mcpgrader/issues"
Changelog = "https://github.com/Manoj-Gujare/mcpgrader/blob/main/CHANGELOG.md"

[project.scripts]
mcpgrader = "mcpgrader.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpgrader"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
